<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Board</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Your whole school day on one screen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* Day Board for the web: the same board as the iPhone and Mac app, for Windows and any browser.
   One calm dark look like the app: grouped cards, bold section titles, class-color bars. */
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card2: #2c2c2e;
  --ink: #f5f5f7;
  --muted: #8e8e93;
  --line: #38383a;
  --blue: #0a84ff;
  --red: #ff453a;
  --green: #30d158;
  --c-history: #ff453a;
  --c-math: #0a84ff;
  --c-science: #000000;
  --c-english: #30d158;
  --c-french: #ffd60a;
  --c-other: #8e8e93;
  --sys: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sys); font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }

/* Shell: a sidebar on a wide window (Windows, Mac), a tab bar at the bottom on a phone. */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 12px; border-right: 1px solid #1c1c1e; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 0 10px 18px; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.tab { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; font-size: 15px; color: var(--ink); }
.tab svg { width: 20px; height: 20px; flex: none; color: var(--blue); }
.tab:hover { background: #151517; }
.tab.on { background: #1f2a3a; }
.tab .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.side .foot { margin-top: auto; color: var(--muted); font-size: 12px; padding: 0 10px; }
main { padding: 26px clamp(16px, 4vw, 48px) 120px; max-width: 1180px; width: 100%; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h1 { font-size: 34px; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
.iconbtn { border: 0; background: var(--card); width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; color: var(--blue); }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 0 28px; align-items: start; }

/* Sections like the app's: bold title, quiet count, small chevron to fold. */
.sec { margin-bottom: 26px; }
.sech { display: flex; align-items: baseline; gap: 8px; width: 100%; border: 0; background: none; padding: 0 4px 8px; cursor: pointer; text-align: left; }
.sech b { font-size: 20px; letter-spacing: -.01em; }
.sech .n { color: var(--muted); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.sech .n.red { color: var(--red); }
.sech .chev { margin-left: auto; color: #5a5a5e; font-size: 13px; transition: transform .2s; }
.sec.closed .chev { transform: rotate(-90deg); }
.sec.closed .card { display: none; }
.card { background: var(--card); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: .5px solid var(--line); min-height: 52px; }
.row:last-child { border-bottom: 0; }
a.row:hover, button.row:hover { background: #232325; }
button.row { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; border-bottom: .5px solid var(--line); }
.grow { flex: 1; min-width: 0; }
.t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.s { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.end { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.end.red, .red { color: var(--red); }
.bar { width: 4px; height: 32px; border-radius: 2px; flex: none; }
.empty { padding: 16px 14px; color: var(--muted); }
.b-history { background: var(--c-history); } .b-math { background: var(--c-math); } .b-english { background: var(--c-english); }
.b-french { background: var(--c-french); } .b-other { background: var(--c-other); } .b-science { background: var(--c-science); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }

/* Morning brief */
.brief { padding: 16px 16px 6px; }
.bhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.bhead b { font-size: 21px; }
.weather { font-size: 20px; font-weight: 600; white-space: nowrap; }
.wline { color: var(--muted); margin-top: 2px; }
.next { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 2px 0; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
.next .nm { font-weight: 600; font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: .5px solid var(--line); margin-top: 14px; }
.stats button { border: 0; background: none; padding: 12px 4px 10px; cursor: pointer; text-align: center; }
.stats b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12px; }

/* Class timeline */
.tl .row { min-height: 54px; padding-top: 0; padding-bottom: 0; border-bottom: 0; }
.tl .time { width: 46px; flex: none; font-variant-numeric: tabular-nums; }
.tl .time b { display: block; font-size: 14px; } .tl .time small { color: var(--muted); font-size: 12px; }
.track { width: 16px; align-self: stretch; position: relative; flex: none; }
.track::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #3a3a3c; }
.track.first::before { top: 50%; } .track.last::before { bottom: 50%; } .track.only::before { display: none; }
.track i { position: absolute; left: 2px; top: 50%; margin-top: -6px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 3px var(--card); }
.tl .past { opacity: .4; }
.tl .now { background: rgba(10,132,255,.14); }
.nowtag { display: block; color: var(--blue); font-size: 12px; font-weight: 600; }
.tl .gap { min-height: 30px; color: var(--muted); font-size: 12px; }
.tl .nowline { min-height: 22px; }
.tl .nowline .track i { background: var(--blue); }
.tl .nowline .ln { flex: 1; height: 3px; border-radius: 2px; background: var(--blue); }

.date { width: 40px; flex: none; text-align: center; }
.date small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }
.date b { display: block; font-size: 19px; }
.date.red small, .date.red b { color: var(--red); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #3a3a3c; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; }
.ic { width: 18px; color: var(--muted); flex: none; text-align: center; }

/* F1 */
.race { padding: 16px; display: grid; gap: 4px; }
.pill { display: inline-block; width: max-content; background: #e10600; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; }
.race .nm { font-size: 22px; font-weight: 700; }
.count { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; margin-top: 6px; }
.team { width: 4px; height: 30px; border-radius: 2px; flex: none; }
.pos { width: 22px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.seg { display: inline-flex; background: var(--card); border-radius: 9px; padding: 2px; margin: 0 4px 8px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.seg button.on { background: #48484a; }

/* Settings and setup */
.field { display: flex; gap: 8px; padding: 12px 14px; flex-wrap: wrap; }
.field input[type=text], .field input[type=password] { flex: 1 1 240px; min-width: 0; background: var(--card2); border: 0; border-radius: 10px; padding: 10px 12px; color: var(--ink); font: inherit; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--blue); color: #fff; font-weight: 600; cursor: pointer; }
.btn.plain { background: var(--card2); color: var(--ink); }
.btn.danger { background: none; color: var(--red); padding-left: 0; }
.note { color: var(--muted); font-size: 13px; padding: 6px 4px 0; }
.err { color: var(--red); }
input[type=color] { width: 44px; height: 28px; border: 0; background: none; padding: 0; cursor: pointer; }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: #39393d; position: relative; cursor: pointer; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(18px); }
.setup { max-width: 520px; margin: 10vh auto 0; display: grid; gap: 14px; }
.setup h1 { font-size: 40px; }
.setup p { color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #2c2c2e; padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 50; }

.bottom { display: none; }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  main { padding-top: max(18px, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bottom { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; justify-content: space-around;
    background: rgba(28,28,30,.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 30px; padding: 6px; }
  .bottom .tab { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 6px 4px; width: auto; flex: 1; align-items: center; color: var(--muted); }
  .bottom .tab.on { background: none; color: var(--blue); }
  .bottom .tab .badge { position: absolute; margin: -2px 0 0 18px; min-width: 16px; height: 16px; font-size: 10px; }
  .bottom .tab { position: relative; }
  h1 { font-size: 30px; }
}
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Tabs">
    <div class="brand"><img src="icon.svg" alt="">Day Board</div>
    <div id="sideTabs"></div>
    <div class="foot" id="updated"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="bottom" id="bottomTabs" aria-label="Tabs"></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  "use strict";
  // ---------- Saved settings (this device only) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("db." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("db." + k, JSON.stringify(v)); } catch {} }
  };
  const FEED = "https://script.google.com/macros/s/AKfycbwq3q3NEayRgvR0doXz86wNB78a_ETbfZowBMDIHVB0x77Ps9ik0G-idw5SQGyiUi12/exec";

  // A setup link can carry the key after "#key=" so it never has to be typed.
  // (Read once, saved on this device, then removed from the address bar.)
  const m = location.hash.match(/key=([A-Za-z0-9_-]+)/);
  if (m) { store.set("key", m[1]); history.replaceState(null, "", location.pathname + location.search); }

  // ---------- Classes: colors and tidy names, same rules as the app ----------
  const SUBJECTS = [["history", "History"], ["math", "Math"], ["science", "Science"], ["english", "English"], ["french", "French"], ["other", "Other classes"]];
  const DEFAULT_COLORS = { history: "#ff453a", math: "#0a84ff", science: "#000000", english: "#30d158", french: "#ffd60a", other: "#8e8e93" };
  function subject(name) {
    const t = (name || "").toLowerCase(), has = ws => ws.some(w => t.includes(w));
    if (has(["history"])) return "history";
    if (has(["geometry", "algebra", "math", "calculus", "precalc", "statistics"])) return "math";
    if (has(["biology", "chemistry", "physics", "science"])) return "science";
    if (has(["english"])) return "english";
    if (has(["french", "français", "francais"])) return "french";
    return "other";
  }
  function cleanName(name) {
    let t = name || "";
    const dash = t.indexOf(" - "); if (dash >= 0) t = t.slice(0, dash);
    t = t.replace(/\s*\([^)]*\)/g, "").replace(/\s+[A-Z]\s+band\b.*$/, "").replace(/\s+(\d{2}-\d{2})\b.*$/, "").trim();
    if (t === t.toUpperCase() && t.length > 3) t = t.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    return t;
  }
  const cleanTitle = t => (t || "").replace(/^\s*\([^)]*\)\s*/, "").replace(/_/g, " ");
  function applyColors() {
    const c = store.get("colors", {});
    for (const [k] of SUBJECTS) document.documentElement.style.setProperty("--c-" + k, c[k] || DEFAULT_COLORS[k]);
  }
  applyColors();

  // ---------- Small helpers ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const day0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const sameDay = (a, b) => day0(a).getTime() === day0(b).getTime();
  const time = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const hm = d => time(d).replace(/\s?[AP]M$/i, "");
  const weekday = d => d.toLocaleDateString([], { weekday: "short" });
  function toast(text) { const t = $("#toast"); t.textContent = text; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

  // ---------- Data ----------
  let data = store.get("feed", null);         // last good copy, so the board shows instantly
  let weather = store.get("weather", null);
  let f1 = null, f1View = "drivers", loading = false, feedError = "";

  function parsed() {
    const d = data || {};
    const work = (d.classroom || []).map(w => ({ ...w, dueAt: w.due ? new Date(w.due) : null }));
    const events = (d.schoolEvents || []).map(e => ({ ...e, s: new Date(e.start), e: new Date(e.end) })).filter(e => !isNaN(e.s));
    const tests = (d.tests || []).map(t => ({ ...t, at: new Date(t.date) })).filter(t => !isNaN(t.at)).sort((a, b) => a.at - b.at);
    const mail = (d.schoolMail || []).map(m => ({ ...m, at: new Date(m.date) })).sort((a, b) => b.at - a.at);
    const changes = (d.changes || []).map(c => ({ ...c, at: new Date(c.at) }));
    return { work, events, tests, mail, changes };
  }
  function group(w) {
    if (!w.dueAt) return "noDate";
    const now = new Date();
    if (w.dueAt < now) return "missing";
    if (sameDay(w.dueAt, now)) return "today";
    if (sameDay(w.dueAt, addDays(now, 1))) return "tomorrow";
    if (w.dueAt < addDays(day0(now), 7)) return "thisWeek";
    return "later";
  }
  const GROUPS = [["missing", "Missing"], ["today", "Due today"], ["tomorrow", "Due tomorrow"], ["thisWeek", "Due this week"], ["later", "Due later"], ["noDate", "No due date"]];

  async function loadFeed(live) {
    const key = store.get("key", "");
    if (!key || loading) return;
    loading = true; spin(true);
    try {
      const r = await fetch(FEED + "?key=" + encodeURIComponent(key) + (live ? "&refresh=1" : ""), { cache: "no-store" });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      data = j; store.set("feed", j); feedError = "";
    } catch (e) {
      feedError = /key/i.test(String(e.message)) ? "That school feed key didn't work. Check it in Settings." : "Couldn't reach the school feed. Showing the last copy.";
    } finally { loading = false; spin(false); render(); schedule(); }
  }
  async function loadWeather() {
    try {
      const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=40.89&longitude=-73.90&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1");
      const d = (await r.json()).daily;
      weather = { hi: Math.round(d.temperature_2m_max[0]), lo: Math.round(d.temperature_2m_min[0]), rain: d.precipitation_probability_max[0] || 0, code: d.weather_code[0], day: day0(new Date()).getTime() };
      store.set("weather", weather); render();
    } catch {}
  }
  async function loadF1() {
    try {
      const base = "https://api.jolpi.ca/ergast/f1/current";
      const [sched, drv, con, last] = await Promise.all(["", "/driverstandings", "/constructorstandings", "/last/results"].map(p => fetch(base + p + ".json").then(r => r.json())));
      f1 = { races: sched.MRData.RaceTable.Races, drivers: drv.MRData.StandingsTable.StandingsLists[0]?.DriverStandings || [],
             teams: con.MRData.StandingsTable.StandingsLists[0]?.ConstructorStandings || [], last: last.MRData.RaceTable.Races[0] };
      if (tab === "f1") render();
    } catch { f1 = { error: true }; if (tab === "f1") render(); }
  }
  const WX = c => c === 0 ? ["☀️", "Clear"] : c === 1 ? ["🌤️", "Mostly clear"] : c === 2 ? ["⛅", "Partly cloudy"] : c === 3 ? ["☁️", "Cloudy"]
    : c === 45 || c === 48 ? ["🌫️", "Foggy"] : c >= 51 && c <= 57 ? ["🌦️", "Drizzle"] : (c >= 61 && c <= 67) || (c >= 80 && c <= 82) ? ["🌧️", "Rain"]
    : (c >= 71 && c <= 77) || c === 85 || c === 86 ? ["🌨️", "Snow"] : c >= 95 ? ["⛈️", "Storms"] : ["🌤️", "Mixed"];

  // ---------- Tabs ----------
  const ICONS = {
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    school: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    f1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4M5 4h13l-2 4 2 4H5"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5M20 3v5.5h-5.5"/></svg>'
  };
  const TABS = [["today", "Today"], ["school", "School"], ["inbox", "Inbox"], ["f1", "F1"], ["settings", "Settings"]];
  let tab = store.get("tab", "today");
  function go(t) { tab = t; store.set("tab", t); render(); $("#main").focus({ preventScroll: true }); scrollTo(0, 0); if (t === "f1" && !f1) loadF1(); }
  function drawTabs() {
    const p = parsed();
    const badges = { school: p.work.filter(w => group(w) === "missing").length, inbox: p.mail.length };
    const html = TABS.map(([id, name]) => `<button class="tab${tab === id ? " on" : ""}" data-tab="${id}" aria-current="${tab === id ? "page" : "false"}">${ICONS[id]}<span>${name}</span>${badges[id] ? `<span class="badge">${badges[id]}</span>` : ""}</button>`).join("");
    $("#sideTabs").innerHTML = html; $("#bottomTabs").innerHTML = html;
    $("#updated").textContent = data && data.updatedAt ? "School updated " + time(new Date(data.updatedAt)) : "";
  }
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab]"); if (t) return go(t.dataset.tab);
    const h = e.target.closest("[data-fold]");
    if (h) { const k = "fold." + h.dataset.fold; const closed = !store.get(k, false); store.set(k, closed); h.parentElement.classList.toggle("closed", closed); h.setAttribute("aria-expanded", String(!closed)); return; }
    const a = e.target.closest("[data-act]"); if (a) actions[a.dataset.act]?.(a);
  });
  function spin(on) { document.querySelectorAll(".refresh").forEach(b => b.classList.toggle("spin", on)); }

  // ---------- Building blocks ----------
  function section(key, title, count, body, red) {
    const closed = store.get("fold." + key, false);
    return `<section class="sec${closed ? " closed" : ""}"><button class="sech" data-fold="${key}" aria-expanded="${!closed}"><b>${esc(title)}</b>${count != null ? `<span class="n${red ? " red" : ""}">${esc(count)}</span>` : ""}<span class="chev">▾</span></button><div class="card">${body}</div></section>`;
  }
  const bar = name => `<span class="bar b-${subject(name)}"></span>`;
  function workRow(w, g) {
    const due = !w.dueAt ? "" : g === "missing" ? w.dueAt.toLocaleDateString([], { month: "short", day: "numeric" })
      : g === "today" || g === "tomorrow" ? time(w.dueAt) : g === "thisWeek" ? weekday(w.dueAt) : w.dueAt.toLocaleDateString([], { month: "short", day: "numeric" });
    return `<a class="row" href="${esc(w.link || "#")}" target="_blank" rel="noopener">${bar(w.course)}<span class="grow"><span class="t t2">${esc(cleanTitle(w.title))}</span><span class="s">${esc(cleanName(w.course))}</span></span><span class="end${g === "missing" ? " red" : ""}">${esc(due)}</span></a>`;
  }
  function todoGroups(p, which) {
    return which.map(([g, title]) => {
      const items = p.work.filter(w => group(w) === g).sort((a, b) => (a.dueAt || 0) - (b.dueAt || 0));
      if (!items.length) return "";
      return section("todo." + g, title, items.length, items.map(w => workRow(w, g)).join(""), g === "missing");
    }).join("");
  }
  function timeline(list) {
    if (!list.length) return `<div class="empty">No classes coming up</div>`;
    const now = new Date(), out = [];
    let placedNow = false;
    list.forEach((c, i) => {
      if (!placedNow && !c.allDay && sameDay(now, c.s) && c.s > now && i > 0 && list[i - 1].e <= now) {
        out.push(`<div class="row nowline"><span class="time"><b style="color:var(--blue)">${hm(now)}</b></span><span class="track"><i></i></span><span class="ln"></span></div>`);
        placedNow = true;
      }
      const isNow = c.s <= now && now < c.e, past = c.e <= now;
      const pos = list.length === 1 ? " only" : i === 0 ? " first" : i === list.length - 1 ? " last" : "";
      const mins = Math.round((c.e - c.s) / 60000);
      out.push(`<div class="row${past ? " past" : ""}${isNow ? " now" : ""}"><span class="time"><b>${c.allDay ? "All" : hm(c.s)}</b><small>${c.allDay ? "day" : hm(c.e)}</small></span><span class="track${pos}"><i class="b-${subject(c.title)}"></i></span><span class="grow"><span class="t">${esc(cleanName(c.title))}</span>${isNow ? `<span class="nowtag">Now · until ${time(c.e)}</span>` : ""}</span><span class="end${c.kind === "test" ? " red" : ""}">${c.kind === "test" ? "Test" : c.allDay ? "" : mins + " min"}</span></div>`);
      const n = list[i + 1];
      if (n && !c.allDay) {
        const gap = Math.round((n.s - c.e) / 60000);
        if (gap >= 15) out.push(`<div class="row gap"><span class="time"></span><span class="track"></span>${gap >= 30 && c.e.getHours() >= 11 && c.e.getHours() <= 13 ? "Lunch" : "Free"} · ${gap} min</div>`);
      }
    });
    return `<div class="tl">${out.join("")}</div>`;
  }
  function classDay(p) {
    const classes = p.events.filter(e => e.kind === "class" || e.kind === "test").sort((a, b) => a.s - b.s);
    const now = new Date();
    const today = classes.filter(c => sameDay(c.s, now) && c.e > now);
    const day = today.length ? day0(now) : (classes.find(c => c.s > now) || {}).s;
    return { day, list: day ? classes.filter(c => sameDay(c.s, day)) : [] };
  }
  function dayLabel(d) { const now = new Date(); return sameDay(d, now) ? "Today" : sameDay(d, addDays(now, 1)) ? "Tomorrow" : d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }); }

  // ---------- Screens ----------
  function header(title) {
    return `<div class="top"><h1>${esc(title)}</h1><button class="iconbtn refresh" data-act="refresh" aria-label="Refresh" title="Refresh (Ctrl+R)">${ICONS.refresh}</button></div>${feedError ? `<p class="note err" style="margin:-8px 0 14px">${esc(feedError)}</p>` : ""}`;
  }
  function today(p) {
    const now = new Date(), h = now.getHours();
    const greet = h >= 4 && h < 12 ? "Good morning, Ryan" : h < 17 && h >= 12 ? "Good afternoon, Ryan" : "Good evening, Ryan";
    const classes = p.events.filter(e => e.kind === "class" && !e.allDay).sort((a, b) => a.s - b.s);
    const cur = classes.find(c => c.s <= now && now < c.e), nxt = classes.find(c => c.s > now), show = cur || nxt;
    const missing = p.work.filter(w => group(w) === "missing").length, tomorrow = p.work.filter(w => group(w) === "tomorrow").length;
    const wx = weather && weather.day === day0(now).getTime() ? weather : null;
    const nextLine = show ? `<button class="next" data-act="week">${bar(show.title)}<span class="grow"><span class="nm">${esc(cleanName(show.title))}</span><span class="s">${cur ? "Now · until " + time(cur.e) : (sameDay(nxt.s, now) ? time(nxt.s) + " · in " + Math.max(1, Math.round((nxt.s - now) / 60000)) + " min" : weekday(nxt.s) + " " + time(nxt.s))}</span></span><span class="end">›</span></button>` : "";
    const brief = `<div class="brief"><div class="bhead"><b>${greet}</b>${wx ? `<span class="weather">${WX(wx.code)[0]} ${wx.hi}°</span>` : ""}</div>${wx ? `<div class="wline">${WX(wx.code)[1]} · H:${wx.hi}° L:${wx.lo}°${wx.rain >= 20 ? " · " + wx.rain + "% rain" : ""}</div>` : ""}${nextLine}
      <div class="stats"><button data-tab="school"><b class="${missing ? "red" : ""}">${missing}</b><small>missing</small></button><button data-tab="school"><b>${tomorrow}</b><small>due tomorrow</small></button><button data-tab="inbox"><b>${p.mail.length}</b><small>emails</small></button></div></div>`;
    const recent = p.changes.filter(c => c.kind !== "done" && c.at > addDays(now, -2)).sort((a, b) => b.at - a.at).slice(0, 8);
    const ago = d => { const m = Math.round((now - d) / 60000); return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };
    const label = { new: "New", due: "Due date changed", event_new: "Added to calendar", event_moved: "Moved", event_canceled: "Canceled" };
    const news = recent.map(c => { const i = c.text.indexOf(": "); const course = i > 0 ? cleanName(c.text.slice(0, i)) : ""; const title = i > 0 ? c.text.slice(i + 2) : c.text;
      return `<div class="row">${bar(c.text)}<span class="grow"><span class="t t2">${esc(cleanTitle(title))}</span><span class="s">${esc([course, label[c.kind] || "", ago(c.at)].filter(Boolean).join(" · "))}</span></span></div>`; }).join("");
    const cd = classDay(p);
    const left = section("brief", "Morning brief", null, brief) + (news ? section("new", "What's new", null, news) : "");
    const right = section("classes", "Classes", cd.day ? dayLabel(cd.day) : null, timeline(cd.list)) + todoGroups(p, GROUPS.slice(0, 3));
    return header(now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })) + `<div class="cols"><div>${left}</div><div>${right}</div></div>`;
  }
  function school(p) {
    const now = new Date();
    const tests = p.tests.map(t => { const days = Math.round((day0(t.at) - day0(now)) / 86400000); const urgent = days <= 2;
      return `<a class="row" href="${esc(t.link || "#")}" target="_blank" rel="noopener"><span class="date${urgent ? " red" : ""}"><small>${t.at.toLocaleDateString([], { month: "short" }).toUpperCase()}</small><b>${t.at.getDate()}</b></span>${bar((t.course || "") + " " + t.title)}<span class="grow"><span class="t t2">${esc(t.title)}</span><span class="s">${esc(t.course ? cleanName(t.course) : t.at.toLocaleDateString([], { weekday: "long" }))}</span></span><span class="end${urgent ? " red" : ""}">${days <= 0 ? "Today" : days === 1 ? "Tomorrow" : "in " + days + " days"}</span></a>`; }).join("");
    const groups = todoGroups(p, GROUPS);
    return header("School") + `<div class="cols"><div>${groups || section("todo", "Classroom to-do", 0, `<div class="empty">No assigned work. Nice!</div>`)}</div><div>${section("tests", "Tests", p.tests.length || null, tests || `<div class="empty">No tests in the next 6 weeks</div>`)}</div></div>`;
  }
  function inbox(p) {
    const rows = p.mail.map(m => { const name = (m.sender || "").replace(/<.*>/, "").replace(/"/g, "").trim() || m.sender;
      const initials = name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
      const when = sameDay(m.at, new Date()) ? time(m.at) : m.at.toLocaleDateString([], { month: "short", day: "numeric" });
      return `<a class="row" href="${esc(m.link || "https://mail.google.com")}" target="_blank" rel="noopener"><span class="avatar">${esc(initials)}</span><span class="grow"><span class="t"><b>${esc(name)}</b></span><span class="t">${esc(m.subject)}</span><span class="s">${esc(m.snippet || "")}</span></span><span class="end">${m.unread ? '<span class="dot" style="display:inline-block;margin-right:6px"></span>' : ""}${esc(when)}${m.asks ? " ?" : ""}</span></a>`; }).join("");
    return header("Inbox") + section("schoolMail", "School email", p.mail.length || null, rows || `<div class="empty">Nothing waiting on you</div>`) +
      `<p class="note">Personal Gmail and iCloud Mail are only in the iPhone and Mac app.</p>`;
  }
  function f1Screen() {
    if (!f1) return header("F1") + `<p class="note">Loading the season…</p>`;
    if (f1.error) return header("F1") + `<p class="note err">Couldn't load F1 data. Try refreshing.</p>`;
    const now = new Date();
    const at = r => new Date(r.date + "T" + (r.time || "12:00:00Z"));
    const next = f1.races.find(r => at(r) > addDays(now, -0.1));
    let card = "";
    if (next) {
      const sessions = [["FirstPractice", "Practice 1"], ["SecondPractice", "Practice 2"], ["ThirdPractice", "Practice 3"], ["SprintQualifying", "Sprint qualifying"], ["Sprint", "Sprint"], ["Qualifying", "Qualifying"]]
        .filter(([k]) => next[k]).map(([k, n]) => [n, new Date(next[k].date + "T" + (next[k].time || "12:00:00Z"))]).concat([["Race", at(next)]]);
      card = section("nextRace", "Next race", null, `<div class="race"><span class="pill">ROUND ${esc(next.round)}</span><span class="nm">${esc(next.raceName)}</span><span class="s">${esc(next.Circuit.Location.locality + ", " + next.Circuit.Location.country)}</span><span class="count" id="f1count"></span><span class="s">until lights out · ${at(next).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</span></div>` +
        sessions.map(([n, d]) => `<div class="row${d < now ? " past" : ""}" style="${d < now ? "opacity:.45" : ""}"><span class="grow">${esc(n)}</span><span class="end">${d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</span></div>`).join(""));
      f1.countTo = at(next);
    }
    const last = f1.last ? section("last", "Last race", f1.last.raceName.replace(" Grand Prix", " GP"), f1.last.Results.slice(0, 3).map(r =>
      `<div class="row"><span class="pos">${r.position}</span><span class="grow"><span class="t">${esc(r.Driver.givenName + " " + r.Driver.familyName)}</span><span class="s">${esc(r.Constructor.name)}</span></span></div>`).join("")) : "";
    const rows = f1View === "drivers"
      ? f1.drivers.slice(0, 10).map(d => `<div class="row"><span class="pos">${d.position}</span><span class="grow"><span class="t">${esc(d.Driver.givenName + " " + d.Driver.familyName)}</span><span class="s">${esc(d.Constructors[0]?.name || "")}</span></span><span class="end"><b style="color:var(--ink)">${d.points}</b></span></div>`).join("")
      : f1.teams.slice(0, 10).map(t => `<div class="row"><span class="pos">${t.position}</span><span class="grow"><span class="t">${esc(t.Constructor.name)}</span></span><span class="end"><b style="color:var(--ink)">${t.points}</b></span></div>`).join("");
    const standings = `<div class="seg" role="group" aria-label="Standings"><button class="${f1View === "drivers" ? "on" : ""}" data-act="drivers">Drivers</button><button class="${f1View === "teams" ? "on" : ""}" data-act="teams">Teams</button></div>` + section("standings", "Standings", null, rows);
    return header("F1 " + (f1.races[0]?.season || "")) + `<div class="cols"><div>${card}${last}</div><div>${standings}</div></div>`;
  }
  function settings() {
    const key = store.get("key", ""), c = store.get("colors", {}), notes = store.get("notify", false);
    const perm = "Notification" in window ? Notification.permission : "unsupported";
    const colors = SUBJECTS.map(([k, n]) => `<label class="row"><span class="bar b-${k}"></span><span class="grow">${n}</span><input type="color" data-color="${k}" value="${c[k] || DEFAULT_COLORS[k]}" aria-label="${n} color"></label>`).join("");
    return `<div class="top"><h1>Settings</h1></div><div class="cols"><div>` +
      section("s.school", "School (ECFS)", null, `<div class="row"><span class="grow">School feed</span><span class="end">${key ? "Connected" : "Not set up"}</span></div><div class="field"><input type="password" id="keyIn" placeholder="${key ? "Paste a new key to change it" : "Paste your school feed key"}" autocomplete="off" aria-label="School feed key"><button class="btn" data-act="saveKey">Save</button></div>${key ? `<div class="field"><button class="btn danger" data-act="forget">Remove from this computer</button></div>` : ""}`) +
      `<p class="note">The key stays on this computer only. Day Board reads your school feed; it can't change anything.</p><br>` +
      section("s.notify", "Notifications", null, `<label class="row"><span class="grow">Class reminders and morning summary<span class="s">${perm === "denied" ? "Blocked in your browser's site settings" : perm === "unsupported" ? "This browser can't show notifications" : "5 min before each class, and a summary when you open it in the morning"}</span></span><input type="checkbox" class="switch" data-act="notify" ${notes && perm === "granted" ? "checked" : ""} ${perm === "denied" || perm === "unsupported" ? "disabled" : ""}></label>`) +
      `<p class="note">On Windows they show while Day Board is open (it can stay minimized). The iPhone and Mac app send them even when closed.</p>` +
      `</div><div>` + section("s.colors", "Class colors", null, colors + `<div class="field"><button class="btn plain" data-act="resetColors">Reset class colors</button></div>`) +
      section("s.install", "Install on this computer", null, `<div class="row"><span class="grow">In Edge or Chrome, click the <b>Install</b> icon at the right end of the address bar (or ⋯ → Apps → Install Day Board). It gets its own window and Start menu icon.</span></div>${deferredInstall ? `<div class="field"><button class="btn" data-act="install">Install Day Board</button></div>` : ""}`) +
      `</div></div>`;
  }
  function setup() {
    return `<div class="setup"><img src="icon.svg" alt="" width="64" height="64" style="border-radius:16px"><h1>Day Board</h1><p>Your school day on one screen. Paste your school feed key to connect your classes, Classroom and school email. It stays on this computer.</p><div class="card"><div class="field"><input type="password" id="keyIn" placeholder="School feed key" autocomplete="off" aria-label="School feed key"><button class="btn" data-act="saveKey">Connect</button></div></div><p class="note">Use the setup link from Claude to skip typing it.</p></div>`;
  }
  function render() {
    applyColors();
    const p = parsed();
    if (!store.get("key", "") && tab !== "settings" && tab !== "f1") { $("#main").innerHTML = setup(); drawTabs(); return; }
    $("#main").innerHTML = tab === "school" ? school(p) : tab === "inbox" ? inbox(p) : tab === "f1" ? f1Screen() : tab === "settings" ? settings() : today(p);
    drawTabs(); tickF1();
  }

  // ---------- Actions ----------
  const actions = {
    refresh: () => { loadFeed(true); loadWeather(); if (tab === "f1") loadF1(); },
    saveKey: () => { const v = ($("#keyIn").value || "").trim(); if (!v) return; store.set("key", v); toast("Connected. Loading your school…"); go("today"); loadFeed(false); },
    forget: () => { store.set("key", ""); store.set("feed", null); data = null; toast("Removed from this computer"); render(); },
    resetColors: () => { store.set("colors", {}); render(); },
    drivers: () => { f1View = "drivers"; render(); },
    teams: () => { f1View = "teams"; render(); },
    week: () => go("school"),
    notify: async el => {
      if (el.checked) {
        const r = await Notification.requestPermission();
        store.set("notify", r === "granted");
        if (r === "granted") new Notification("Day Board", { body: "Notifications are on. You'll get class reminders while Day Board is open.", icon: "icon.svg" });
      } else store.set("notify", false);
      render(); schedule();
    },
    install: async () => { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } }
  };
  document.addEventListener("input", e => {
    const k = e.target.dataset && e.target.dataset.color;
    if (k) { const c = store.get("colors", {}); c[k] = e.target.value; store.set("colors", c); applyColors(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "keyIn") actions.saveKey();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r") { e.preventDefault(); actions.refresh(); }
  });
  let deferredInstall = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (tab === "settings") render(); });

  // ---------- Notifications while open ----------
  let timers = [];
  function notify(title, body) {
    if (!store.get("notify", false) || !("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(title, { body, icon: "icon.svg", tag: title }); } catch {}
  }
  function schedule() {
    timers.forEach(clearTimeout); timers = [];
    if (!store.get("notify", false)) return;
    const now = Date.now(), p = parsed();
    p.events.filter(e => e.kind === "class" && !e.allDay).forEach(c => {
      const at = c.s.getTime() - 5 * 60000;
      if (at > now && at - now < 24 * 3600000) timers.push(setTimeout(() => notify(cleanName(c.title) + " in 5 min", time(c.s) + "–" + time(c.e)), at - now));
    });
    // Morning summary: once a day, the first time Day Board is open after 6 AM.
    const d = new Date(), stamp = day0(d).getTime();
    if (d.getHours() >= 6 && d.getHours() < 12 && store.get("lastMorning", 0) !== stamp && data) {
      store.set("lastMorning", stamp);
      const missing = p.work.filter(w => group(w) === "missing").length, tom = p.work.filter(w => group(w) === "tomorrow").length;
      const first = p.events.filter(e => e.kind === "class" && !e.allDay && sameDay(e.s, d)).sort((a, b) => a.s - b.s)[0];
      notify("Good morning, Ryan", `You have ${missing} missing and ${tom} due tomorrow.` + (first ? ` First class: ${cleanName(first.title)} at ${time(first.s)}.` : ""));
    }
  }

  // ---------- Live bits ----------
  function tickF1() {
    const el = document.getElementById("f1count");
    if (!el || !f1 || !f1.countTo) return;
    let s = Math.max(0, Math.floor((f1.countTo - Date.now()) / 1000));
    const dd = Math.floor(s / 86400); s %= 86400;
    const pad = n => String(n).padStart(2, "0");
    el.textContent = (dd ? dd + "d " : "") + pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }
  setInterval(tickF1, 1000);
  setInterval(() => { if (tab === "today") render(); }, 60000);          // moves the now line and countdowns
  setInterval(() => loadFeed(false), 30 * 60000);                          // same 30-minute rhythm as the school script
  addEventListener("focus", () => { if (data && Date.now() - new Date(data.lastCheck || data.updatedAt || 0) > 10 * 60000) loadFeed(false); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  render();
  loadFeed(false);
  if (!weather || weather.day !== day0(new Date()).getTime()) loadWeather();
  if (tab === "f1") loadF1();
})();
</script>
</body>
</html>
